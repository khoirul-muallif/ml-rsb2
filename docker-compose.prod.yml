# E:\laragon\www\ml-rsb2\docker-compose.prod.yml
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_anjungan_app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./.env:/var/www/.env  # ← TAMBAHKAN BARIS INI
    networks:
      - laravel
    # Tidak perlu host network karena database di IP lain
  nginx:
    image: nginx:1.25-alpine
    container_name: laravel_anjungan_nginx
    ports:
      - "8081:80"  # Port 8081 di server
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - laravel
networks:
  laravel:
    driver: bridge