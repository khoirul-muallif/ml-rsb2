# version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_anjungan_app
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - PHP_MEMORY_LIMIT=512M
    restart: unless-stopped
    networks:
      - laravel

  nginx:
    image: nginx:1.25-alpine
    container_name: laravel_anjungan_nginx
    ports:
      - "8081:80"  # Port 8081 di host, port 80 di container
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - laravel

networks:
  laravel:
    driver: bridge